<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0e05"/>
      <stop offset="100%" stop-color="#0a0704"/>
    </radialGradient>
  </defs>

  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Scissors blades -->
  <!-- Left blade -->
  <line x1="8" y1="8" x2="20" y2="20" stroke="#d4a96a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right blade -->
  <line x1="20" y1="8" x2="8" y2="20" stroke="#d4a96a" stroke-width="2" stroke-linecap="round"/>
  <!-- Pivot screw -->
  <circle cx="14" cy="14" r="1.5" fill="#d4a96a"/>

  <!-- Music note (eighth note) -->
  <!-- Note head -->
  <ellipse cx="22" cy="22" rx="2.5" ry="1.8" fill="#d4a96a" transform="rotate(-20,22,22)"/>
  <!-- Stem -->
  <line x1="24" y1="21" x2="24" y2="13" stroke="#d4a96a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Flag -->
  <path d="M24 13 Q29 15 27 19" stroke="#d4a96a" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Subtle golden glow ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#d4a96a" stroke-width="0.5" opacity="0.3"/>
</svg>
